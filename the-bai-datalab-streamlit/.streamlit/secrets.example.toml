# Copy this file to:
# .streamlit/secrets.toml
#
# NEVER commit the real secrets.toml file.

[instructor]
username = "instructor"
password = "REPLACE_WITH_A_LONG_UNIQUE_PASSWORD"

[pilot]
# Optional: paste your post-session Qualtrics survey URL here.
# The app automatically appends ?code=BAI-XXXX when a participant clicks it.
post_survey_url = ""

# Optional: Google Sheets logging (keeps pilot logs permanently on Streamlit Community Cloud).
# Share your Google Sheet with the service account's client_email as Editor.
# [google_sheets]
# spreadsheet_url = "https://docs.google.com/spreadsheets/d/YOUR_SHEET_ID/edit"
# worksheet_name = "activity_logs"
#
# [google_sheets.service_account]
# type = "service_account"
# project_id = "..."
# private_key_id = "..."
# private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
# client_email = "...@....iam.gserviceaccount.com"
# client_id = "..."
# token_uri = "https://oauth2.googleapis.com/token"

# Optional future deployment/API credentials can also be stored here.
# OPENAI_API_KEY = ""
# ANTHROPIC_API_KEY = ""
# GEMINI_API_KEY = ""
# MISTRAL_API_KEY = ""
